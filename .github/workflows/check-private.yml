name: check-private
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "23 4 * * *" # daily audit of the tracked tree
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for private content
        run: python3 scripts/check-private.py --all
