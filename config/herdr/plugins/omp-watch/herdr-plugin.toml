id = "dotfiles.omp-watch"
name = "omp session watcher"
version = "0.9.3"
min_herdr_version = "0.9.1"
description = "Reports omp agent state to herdr by tailing omp's own session transcript, since omp's extension API does not deliver lifecycle events and herdr ships no screen-manifest fallback for omp."
platforms = ["linux", "macos"]
#
#
# 0.9.3: roster config-version naming (2026-09-24). omp-config-version.ts
# (agent extension) injects a "config v<N>" custom entry at session start,
# read from config/omp/VERSION via the ~/.omp/agent/VERSION symlink --
# snapshotted ONCE per process, so an agent started at v22 keeps showing
# v22 after the repo moves on (parallel agents on different versions are
# the point). watch.py reads the newest such entry from the transcript
# HEAD (config_version()) and renames the roster entry "omp-v<N>" via
# `herdr agent rename` -- names are separate from the agent kind ("omp"
# stays the kind; renaming does not affect status convergence, verified
# live). Renames only touch our own naming shape (unset/"omp"/omp-v<N>);
# user-given agent names always win. Sessions older than the feature keep
# no version. Also: --daemon mode (double-fork, ppid-1 aware) so the
# watcher can be hot-swapped from a short-lived launcher -- the daemon
# exits when the herdr server dies (SERVER_DEATH_TICKS consecutive failed
# ticks), releasing the lock for the next server start's [[startup]]
# instance; and SIGHUP re-execs a foreground watcher for code reload.
# maybe_idle grace clock ran on the session FILE's mtime, but the harness
# appends UNrecognizable entries long after a turn's final assistant
# message -- 15-min subagent-check-in nudges, anti-dither/delegation
# nudges, model_change records. Every such append re-armed the 45s
# window: the verdict flipped back to "working", expired to "idle" again
# ~45s later, and each cycle re-fired the working->idle transition that
# agent-discord's notify hook turns into a "done" ping -- five pings for
# ONE turn (11:16:10, 11:21:37, 11:45:06, 11:49:31, 11:51:35), then
# again at 12:06:37, each exactly 45s after the triggering append.
# latest_verdict() now also returns the newest recognizable entry's own
# "timestamp" as an epoch, and main() keys the grace clock on that
# signal age (mtime only as fallback for timestamp-less entries).
# Unrecognizable entries carry no verdict signal, so they carry no wake
# signal either; a genuine continuation still reopens "working" the
# moment its recognizable entry lands.
#
# 0.9.0: pid-based omp attribution (2026-09-15). The cwd-keyed presence
# match mis-credited ANY pane sharing a cwd with a live omp process --
# observed live: a new pane opened in thor-voiceai (an nvim+omp REPL pane's
# cwd) was reported agent=omp regardless of its real occupant, crushing
# claude's native registration every ~3s and making mixed omp/claude
# work in one repo impossible to attribute. TTY matching alone fails for
# REPL-nested omp (it runs on nvim's internal pty). The robust link is
# ANCESTRY: an omp process's ppid chain terminates EXACTLY at the pane
# shell (verified live: omp -> nvim --embed -> nvim -> pane shell pid).
# watch.py now reads `herdr pane process-info` per pane per tick (~0.2s
# for 8 panes) and matches by pane-shell-pid membership in a live omp's
# bounded ancestor set -- no cwd involvement. Registry cross-check/
# rotation machinery untouched; transcript lookup stays cwd-keyed
# (single-omp-per-cwd keeps working; two omp in ONE cwd sharing a
# transcript dir remains the flagged edge).
#
# 0.9.1: foreign agent-slot claims are detected, reported once, and
# skipped (2026-09-15). A managed integration's agent_session claim --
# planted by ANY claude process inheriting a pane's HERDR_PANE_ID, down to
# a one-shot `claude -p` probe -- owns that pane's agent slot for good:
# herdr accepts our report-agent calls with "ok" and applies none, so the
# pane's status freezes at whatever was live when the claim landed (hit
# live on w6:p4, stuck "working"/seq 1181 for an hour; also present on
# w7:p1 from a normal claude session run inside an omp REPL pane). Proven
# unfixable from here: our source, never-used fresh sources,
# release-agent, and a no-id report-agent-session from the owning source
# are all no-ops, and the claim persists in ~/.config/herdr/session.json
# across restarts. watch.py now names the owning source in a one-shot
# stderr warning per pane and skips the pane instead of burning source
# rotations on it. Remedies live outside the watcher: recreate the pane,
# or scripts/herdr-clear-agent-claims.sh (stops the server, strips
# claims). Prevention is in the herdr-workstreams skill: strip HERDR_*
# before invoking another agent CLI as a subprocess.
# herdr's [[startup]] hook has no ongoing crash supervision AND does not
# signal this process when the server itself shuts down -- both verified
# empirically 2026-09-04. A shell respawn-loop wrapper (`while true; do
# python3 watch.py; done`) fixed the first problem but made the second one
# worse: on every server restart the wrapper (and its running child) got
# orphaned instead of dying, so it just kept looping under init forever --
# three of them accumulated over one session, all still polling and
# reporting, fighting each other over the same panes. watch.py now owns
# both concerns itself (respawn-on-crash via an internal loop, immediate
# clean exit the moment its ppid changes -- i.e. it's been orphaned), so a
# bare invocation is correct and the wrapper is gone for good.
#
# 0.3.0: watch.py also takes a machine-wide singleton lock (/tmp/omp-watch
# .lock via flock) and uses a timestamp-based --seq instead of a small
# per-process counter. Root-caused 2026-09-04: a second, independently-
# launched copy of this exact script (plausibly from a different agent
# session sharing this machine/repo) was concurrently reporting under the
# same hardcoded --source, and an earlier ad-hoc manual test's --seq 999
# left the shared source's sequence "high water mark" poisoned -- a fresh
# process's low seq (1, 2, 3...) was silently treated as stale forever,
# so its idle reports returned a clean "ok" yet never actually applied.
# The lock makes concurrent instances structurally impossible regardless
# of who launches a second one; the timestamp seq is immune to any
# historical ad-hoc value poisoning it either way.
#
# 0.4.0: premature-"done" fix. A text-only assistant message (no embedded
# toolCall) was reported as idle immediately -- but omp's loop machinery
# routinely CONTINUES the turn after exactly such interim answers
# (prewalk-continue, plan approvals, async subagent results): 109
# confirmed continuations vs 861 genuine ends across all local
# transcripts, and the interim entry is indistinguishable from a genuine
# final (same keys, stopReason "stop" on both). The continuation lands
# p50 12.7s / p90 42s after the interim text, so the watcher now returns
# "maybe_idle" for that tail and holds it working until the session file
# has been quiet for IDLE_GRACE_SECONDS (45s); any new byte refreshes
# mtime and flips the verdict straight back to working, so the hold
# self-corrects instead of guessing. Genuine finals report idle ~45s
# late -- a deliberate tradeoff against false dones.
#
# 0.5.0: delivery-path fix. Live incident 2026-09-05 (w5:p8, heinzel-haus):
# the watcher computed the right verdict, but herdr silently stopped
# APPLYING this pane's reports from the shared source -- exit 0, no error,
# registry frozen on its idle fallback while the agent demonstrably worked
# (transcript tail = toolResult). 25+ minutes of 3s resends did not
# recover; a single report from a never-before-used source name landed
# instantly. The pane-layer agent_status (pane list) can even agree with
# us while the REGISTRY (agent list -- what the sidebar renders) is wedged,
# so the old cross-check was blind to exactly this failure. watch.py now
# cross-checks `herdr agent list` every tick and, after 4 consecutive
# non-converging sends, rotates the pane onto a fresh source name (bounded:
# max 3 rotations, then a 120s cooldown). Same-state registry entries are
# deduped by herdr (no seq bump), so only genuine mismatches trigger sends.
#
# 0.6.0: tail-window collapse fix (2026-09-05, w5:p7 heinzel-exploration).
# The old reader took a fixed 32KB byte window from EOF; when the newest
# entry was LARGER than the window (heinzel agents routinely write 40-60KB
# toolResult/assistant entries from big file reads), seek() landed mid-
# line, readline() discarded everything to EOF, and the verdict collapsed
# to "no recognizable entries -> default idle" -- a false done during
# active work. Measured on this one session file: 166 collapse landings,
# 27.3 min total, worst 6.1 min continuous (18:14-18:20, the live
# incident). watch.py now scans backwards from EOF over newline-
# terminated lines (watch.latest_verdict): no per-entry size assumption,
# partial final lines skipped, unparseable lines skipped, stops at the
# first recognizable entry. Same verdict semantics, robust to any entry
# size.
#
# 0.7.0: turn-level failures surface as herdr "blocked" (2026-09-06). omp
# writes model/provider failures as assistant entries with stopReason
# "error" (+ errorStatus/errorMessage, content usually []); the old
# empty-content fallthrough classified those as "working", pinning failed
# agents at working forever -- observed live during the OpenRouter
# guardrail 404 window. "blocked" lights up the sidebar AND fires the
# agent-discord working->blocked ping (whose embed now carries the
# transcript's errorMessage via common.latest_error). stopReason "aborted"
# ("Interrupted by user") is deliberately NOT blocked: the turn ended
# without failing -- maybe_idle, like any finished turn.
[[startup]]
command = ["python3", "watch.py"]
